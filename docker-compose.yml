version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dico_event
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  web:
    build: .
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment: &django_env
      DJANGO_SETTINGS_MODULE: event_project.settings.dev
      DATABASE_HOST: db
      DATABASE_NAME: dico_event
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_HOST: redis://redis:6379/1
      MINIO_ENDPOINT_URL: minio:9000
      MINIO_ACCESS_KEY: admin123
      MINIO_SECRET_KEY: password123
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    env_file:
      - .env
    command: celery -A event_project worker -l info
    volumes:
      - .:/app
    environment:
      <<: *django_env
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    env_file:
      - .env
    command: celery -A event_project beat -l info
    volumes:
      - .:/app
    environment:
      <<: *django_env
    depends_on:
      - db
      - redis
      - minio

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin123
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
